name: Deploy web to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # wasm(Skwasm) 렌더러 + 루트 경로. 서비스 워커는 끔(배포 직후 구버전 캐시 방지).
      # web/_headers 의 COOP/COEP 가 build/web 으로 복사되어 멀티스레드 렌더링을 켠다.
      - run: flutter build web --wasm --release --base-href / --pwa-strategy=none
      # wrangler.jsonc(assets.directory = build/web) 기준으로 Workers 정적 에셋 배포
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
